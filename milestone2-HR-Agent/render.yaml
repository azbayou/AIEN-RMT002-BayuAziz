services:
  - type: web
    name: hr-agent-assistant
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: AGENT_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: POLICY_INDEX_VERSION
        value: policies-2026-01
      - key: MODEL_MODE
        value: live
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_STT_MODEL
        value: gemini-3.5-flash
      - key: OPIK_API_KEY
        sync: false
      - key: OPIK_WORKSPACE
        value: azbayou
      - key: OPIK_PROJECT_NAME
        value: Milestone 2 - HR Agent
      - key: OPIK_ENABLED
        value: "true"
      - key: SKIP_SETUP
        value: "false"
