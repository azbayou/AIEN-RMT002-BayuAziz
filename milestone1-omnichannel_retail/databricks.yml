bundle:
  name: omnichannel_retail

include:
  - resources/retail_pipeline_job.yml

variables:
  catalog_name:
    description: "Unity Catalog name for retail analytics data"
    default: "retail_analytics"
  warehouse_id:
    description: "Databricks SQL Warehouse ID for analytics and queries"
    default: "auto"

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: retail_analytics

  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: retail_analytics
    run_as:
      user_name: ${workspace.current_user.userName}
